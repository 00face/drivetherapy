name: Universal Release Readiness & Quality Gate

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  release-gate:
    name: Phase 15 Automated Build, Security & QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Clean dependency install
        run: npm ci

      - name: Supply-chain vulnerability gate (0 High/Critical)
        run: npm audit --audit-level=high

      - name: TypeScript & Erasable Syntax static analysis
        run: npm run lint

      - name: Build production bundle, portable native executables & Android scaffold
        run: |
          npm run build:portable-bundle
          node scripts/buildAndroidScaffold.mjs

      - name: Automated unit, property, fuzz, security & lifecycle test suite
        run: npm test

      - name: GraphML & Architecture topology validation
        run: npm run qa:probe

      - name: Generate & verify CycloneDX SBOM and 23-phase release readiness dossier
        run: npm run qa:release-audit
