name: Deploy Public Homepage, Privacy Policy & Terms to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Publish to 00face.github.io/drivetherapy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production site for GitHub Pages (/drivetherapy/)
        env:
          VITE_BASE_PATH: /drivetherapy/
        run: |
          npm run build
          touch dist/.nojekyll
          mkdir -p dist/privacy dist/terms
          sed 's|href="\./|href="../|g; s|src="\./|src="../|g' dist/privacy.html > dist/privacy/index.html
          sed 's|href="\./|href="../|g; s|src="\./|src="../|g' dist/terms.html > dist/terms/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
